server:
  port: ${PORT:8080}

spring:
  application:
    name: affordability-assistant-backend
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:local}
  config:
    import:
      - optional:file:./application-local.yml
      - optional:classpath:application-local.yml

  # Giá trị mặc định kết nối Docker Compose (PostgreSQL 16)
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5433/affordability_db}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 5

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
        jdbc:
          time_zone: Asia/Ho_Chi_Minh

  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration

zeebe:
  client:
    broker:
      gateway-address: ${ZEEBE_GATEWAY_ADDRESS:localhost:26500}
    security:
      plaintext: ${ZEEBE_PLAINTEXT:true}
    worker:
      default-name: affordability-backend-worker

camunda:
  client:
    zeebe:
      gateway-address: ${ZEEBE_GATEWAY_ADDRESS:localhost:26500}
      security:
        plaintext: ${ZEEBE_PLAINTEXT:true}

app:
  ai-service:
    base-url: ${AI_SERVICE_URL:http://localhost:8000}
    connect-timeout-ms: 5000
    read-timeout-ms: 30000

