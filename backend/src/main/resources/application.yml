server:
  port: ${PORT:8080}

spring:
  application:
    name: affordability-assistant-backend
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:local}
  config:
    import:
      - optional:file:./application-local.yml
      - optional:classpath:application-local.yml

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5433/affordability_db}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 5
      pool-name: AffordabilityHikariPool

  jpa:
    hibernate:
      ddl-auto: validate # Check schema from flyway migration
    show-sql: false
    open-in-view: false # Open Session in View
    properties:
      hibernate:
        format_sql: true
        jdbc:
          time_zone: Asia/Ho_Chi_Minh

  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration

# camunda-spring-boot-starter
camunda:
  client:
    mode: ${CAMUNDA_MODE:self-managed}
    grpc-address: ${ZEEBE_GATEWAY_ADDRESS:http://localhost:26500}
    rest-address: ${CAMUNDA_REST_ADDRESS:http://localhost:8081}
    auth:
      method: ${CAMUNDA_AUTH_METHOD:basic}
      username: ${CAMUNDA_AUTH_USERNAME:demo}
      password: ${CAMUNDA_AUTH_PASSWORD:demo}
    worker:
      defaults:
        name: ${CAMUNDA_WORKER_NAME:affordability-backend-worker}
        max-jobs-active: 32
  connection:
    validator:
      enabled: ${CAMUNDA_CONNECTION_VALIDATOR_ENABLED:true}
      retry-attempts: ${CAMUNDA_CONNECTION_VALIDATOR_RETRY_ATTEMPTS:5}
      retry-delay-ms: ${CAMUNDA_CONNECTION_VALIDATOR_RETRY_DELAY_MS:3000}

app:
  ai-service:
    base-url: ${AI_SERVICE_URL:http://localhost:8000}
    connect-timeout-ms: 5000 # 5s to establish TCP connection
    read-timeout-ms: 30000 # 30s

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method # HTTP method
    tags-sorter: alpha