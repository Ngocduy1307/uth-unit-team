server:
  port: 8080

spring:
  application:
    name: affordability-assistant-backend
  profiles:
    active: local

  # Cấu hình kết nối PostgreSQL
  datasource:
    url: jdbc:postgresql://localhost:5433/affordability_db
    username: postgres
    password: postgres
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 5
      pool-name: AffordabilityHikariPool

  # Cấu hình Spring Data JPA / Hibernate
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
        jdbc:
          time_zone: Asia/Ho_Chi_Minh

  # Cấu hình Flyway Migration
  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration

# Cấu hình Camunda 8
zeebe:
  client:
    broker:
      gateway-address: localhost:26500
    security:
      plaintext: true
    worker:
      default-name: affordability-backend-worker
      max-jobs-active: 32

camunda:
  client:
    zeebe:
      gateway-address: localhost:26500
      security:
        plaintext: true

# Cấu hình tích hợp hệ thống nội bộ
app:
  ai-service:
    base-url: http://localhost:8000
    connect-timeout-ms: 5000
    read-timeout-ms: 30000

