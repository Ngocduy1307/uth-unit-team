services:
  postgres:
    image: postgres:16-alpine
    container_name: unit-data-ai-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-income_assistant}
      POSTGRES_USER: ${POSTGRES_USER:-data_ai}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      TZ: Asia/Ho_Chi_Minh
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-data_ai} -d ${POSTGRES_DB:-income_assistant}"]
      interval: 5s
      timeout: 5s
      retries: 20

  flyway:
    image: flyway/flyway:10
    command: -url=jdbc:postgresql://postgres:5432/${POSTGRES_DB:-income_assistant} -user=${POSTGRES_USER:-data_ai} -password=${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env} -schemas=data_ai -defaultSchema=data_ai -createSchemas=true -locations=filesystem:/flyway/sql migrate
    volumes:
      - ./db/migration:/flyway/sql:ro
    depends_on:
      postgres:
        condition: service_healthy

  api:
    build: .
    container_name: unit-data-ai-api
    restart: unless-stopped
    environment:
      DATABASE_URL: ${DATABASE_URL:?Set DATABASE_URL in .env (use sslmode=verify-full in production)}
      INTERNAL_SERVICE_TOKEN: ${INTERNAL_SERVICE_TOKEN:?Set INTERNAL_SERVICE_TOKEN in .env}
      SERVICE_ASSERTION_KEYS: ${SERVICE_ASSERTION_KEYS:-}
      SERVICE_ASSERTION_MAX_SKEW_SECONDS: ${SERVICE_ASSERTION_MAX_SKEW_SECONDS:-120}
      SERVICE_ASSERTION_ISSUER: ${SERVICE_ASSERTION_ISSUER:-spring-boot-backend}
      SERVICE_ASSERTION_AUDIENCE: ${SERVICE_ASSERTION_AUDIENCE:-data-ai}
      MAX_SIGNED_REQUEST_MB: ${MAX_SIGNED_REQUEST_MB:-24}
      APP_ENV: ${APP_ENV:-development}
      DB_POOL_SIZE: ${DB_POOL_SIZE:-5}
      DB_MAX_OVERFLOW: ${DB_MAX_OVERFLOW:-10}
      DB_POOL_TIMEOUT_SECONDS: ${DB_POOL_TIMEOUT_SECONDS:-30}
      DB_POOL_RECYCLE_SECONDS: ${DB_POOL_RECYCLE_SECONDS:-1800}
      DB_CONNECT_TIMEOUT_SECONDS: ${DB_CONNECT_TIMEOUT_SECONDS:-10}
      MAX_FILE_MB: ${MAX_FILE_MB:-20}
      MAX_FILES_PER_CASE: ${MAX_FILES_PER_CASE:-10}
      MAX_PDF_PAGES: ${MAX_PDF_PAGES:-60}
      MAX_CSV_ROWS: ${MAX_CSV_ROWS:-3000}
      OCR_LANG: ${OCR_LANG:-vie+eng}
      EXPORT_MAX_ROWS_PER_SHEET: ${EXPORT_MAX_ROWS_PER_SHEET:-50000}
      IDEMPOTENCY_TTL_HOURS: ${IDEMPOTENCY_TTL_HOURS:-72}
      IDEMPOTENCY_MAX_REQUEST_MB: ${IDEMPOTENCY_MAX_REQUEST_MB:-24}
      IDEMPOTENCY_MAX_RESPONSE_KB: ${IDEMPOTENCY_MAX_RESPONSE_KB:-1024}
      IDEMPOTENCY_IN_PROGRESS_TIMEOUT_SECONDS: ${IDEMPOTENCY_IN_PROGRESS_TIMEOUT_SECONDS:-1800}
      CLAMAV_HOST: ${CLAMAV_HOST:-}
      CLAMAV_PORT: ${CLAMAV_PORT:-3310}
      CLAMAV_TIMEOUT_SECONDS: ${CLAMAV_TIMEOUT_SECONDS:-15}
      CLAMAV_CHUNK_KB: ${CLAMAV_CHUNK_KB:-64}
      STORAGE_ENCRYPTION_PROVIDER: ${STORAGE_ENCRYPTION_PROVIDER:-}
      STORAGE_ENCRYPTION_KEY_REFERENCE: ${STORAGE_ENCRYPTION_KEY_REFERENCE:-}
      EXPORT_ENCRYPTION_PROVIDER: ${EXPORT_ENCRYPTION_PROVIDER:-}
      EXPORT_ENCRYPTION_KEY_REFERENCE: ${EXPORT_ENCRYPTION_KEY_REFERENCE:-}
      REQUIRED_FLYWAY_VERSION: ${REQUIRED_FLYWAY_VERSION:-18}
      REQUIRE_SCOPE_CONSENT: ${REQUIRE_SCOPE_CONSENT:-false}
      MAX_REQUEST_BODY_MB: ${MAX_REQUEST_BODY_MB:-28}
      STORAGE_DIR: /app/storage
      EXPORT_DIR: /app/exports
    ports:
      - "127.0.0.1:${API_PORT:-8001}:8001"
    volumes:
      - data_ai_storage:/app/storage
      - data_ai_exports:/app/exports
    user: "10001:10001"
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8001/ready', timeout=3).read()"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    mem_limit: 1g
    cpus: 2.0
    pids_limit: 128
    ulimits:
      nofile:
        soft: 1024
        hard: 2048
    depends_on:
      flyway:
        condition: service_completed_successfully

  pgadmin:
    image: dpage/pgadmin4:8
    profiles: ["tools"]
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL:?Set PGADMIN_EMAIL in .env}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD:?Set PGADMIN_PASSWORD in .env}
    ports:
      - "127.0.0.1:${PGADMIN_PORT:-5050}:80"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data:
  data_ai_storage:
  data_ai_exports:
